---
- name: Verify API in APIC API Manager
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    apic_platform_endpoint: "https://apic-lab-mgmt-platform-api-apic.apps.itz-jyz46m.infra01-lb.wdc07.techzone.ibm.com"
    apic_manager_endpoint: "https://apic-lab-mgmt-api-manager-apic.apps.itz-jyz46m.infra01-lb.wdc07.techzone.ibm.com"
    gateway_name: "test-gateway"
    namespace: "student-00"
    environment: "dev"

  tasks:
    - name: Get APIC token
      uri:
        url: "{{ apic_platform_endpoint }}/api/token"
        method: POST
        body_format: json
        validate_certs: false
        body:
          username: admin
          password: "{{ lookup('env', 'APIC_PASSWORD') }}"
          realm: "admin/default-idp-1"
          client_id: "caa87d9a-8cd7-4686-8b6e-ee2cdc5ee267"
          client_secret: "3ecff363-7eb3-44be-9e07-6d4386c48b0b"
          grant_type: password
        status_code: 200
      register: token_response

    - name: Verify API exists in APIC
      uri:
        url: "{{ apic_manager_endpoint }}/api/orgs/lab-organization/drafts/draft-apis"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
        status_code: 200
      register: apis_response

    - name: Print confirmation
      debug:
        msg: "API {{ namespace }}-{{ gateway_name }} verified in APIC API Manager. Total APIs: {{ apis_response.json.total_results }}"
