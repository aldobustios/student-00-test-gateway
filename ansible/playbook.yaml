---
- name: Configure DataPower Nano Gateway
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gateway_name: "test-gateway"
    namespace: "student-00"
    environment: "dev"
    k8s_api: "https://api.itz-jyz46m.infra01-lb.wdc07.techzone.ibm.com:6443"

  tasks:
    - name: Wait for DataPowerService to be ready
      shell: |
        for i in $(seq 1 20); do
          STATUS=$(curl -sk \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "{{ k8s_api }}/apis/datapower.ibm.com/v1beta3/namespaces/{{ namespace }}/datapowerservices/{{ gateway_name }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',{}).get('phase','Unknown'))" 2>/dev/null)
          echo "Attempt $i: Status = $STATUS"
          if [ "$STATUS" = "Running" ]; then
            echo "Gateway is ready!"
            exit 0
          fi
          sleep 15
        done
        echo "Gateway did not reach Running state in time - continuing anyway"
        exit 0

    - name: Print gateway info
      debug:
        msg: "Gateway {{ gateway_name }} deployed in namespace {{ namespace }} (environment: {{ environment }})"
